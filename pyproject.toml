[project]
name = "mind"
version = "0.1.0"
description = "Detecção de técnicas de manipulação em texto político brasileiro"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "protego>=0.6.2",
    "cdx-toolkit>=0.9.39",
    "mediacloud>=5.1.0",
    "telethon>=1.44.0",
    "praw>=8.0.3",
]

[project.optional-dependencies]
media = [
    "yt-dlp>=2024.8",
    "mlx-whisper>=0.4",
    "playwright>=1.62.0",
]
store = ["duckdb>=1.0", "pyarrow>=17.0"]
dedup = [
    "datasketch>=1.6",
    "imagehash>=4.3",
    "ocrmac>=1.0.1",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
