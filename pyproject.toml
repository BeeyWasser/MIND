[project]
name = "mind"
version = "0.1.0"
description = "Detecção de técnicas de manipulação em texto político brasileiro"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "protego>=0.6.2",
    "cdx-toolkit>=0.9.39",
    "filelock>=3.16",
    "mediacloud>=5.1.0",
    "telethon>=1.44.0",
    "yt-dlp>=2024.8",
]

[project.scripts]
mind-data = "mind_collect.data_bundle:main"

[project.optional-dependencies]
collect = [
    "gallery-dl>=1.32.10",
    "imagehash>=4.3",
    "pillow>=10.0",
]
media = [
    "gallery-dl>=1.32.10",
    "imagehash>=4.3",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pillow>=10.0",
]
store = ["duckdb>=1.0", "pyarrow>=17.0"]
dedup = [
    "datasketch>=1.6",
    "imagehash>=4.3",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mind_collect"]

[dependency-groups]
dev = ["datasketch>=1.6", "ruff>=0.6", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
